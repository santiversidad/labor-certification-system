name: labor-certification-certificate-types

x-ct-app-environment: &ct_app_environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8280
  FRONTEND_URL: http://localhost:3200
  APP_TIMEZONE: America/Bogota
  DB_CONNECTION: pgsql
  DB_HOST: scl_recovery_postgres
  DB_PORT: 5432
  DB_DATABASE: scl_certificate_types_dev
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: log
  FILESYSTEM_DISK: local
  CERTIFICATE_EVIDENCE_PATH: /workspace-output/pdf
  SANCTUM_STATEFUL_DOMAINS: localhost:3200,127.0.0.1:3200

x-ct-app-build: &ct_app_build
  context: .
  dockerfile: docker/php/Dockerfile

services:
  app:
    image: scl-ct-app:prepared
    build: *ct_app_build
    container_name: scl_ct_app
    environment: *ct_app_environment
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ct_backend_vendor:/var/www/html/vendor
      - ct_backend_build:/var/www/html/public/build
      - ct_backend_storage:/var/www/html/storage
      - ./output:/workspace-output
    networks:
      - default
      - recovery_database
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    container_name: scl_ct_nginx
    ports:
      - "127.0.0.1:8280:80"
    volumes:
      - ./backend/laravel-app:/var/www/html:ro
      - ct_backend_build:/var/www/html/public/build:ro
      - ct_backend_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: scl-ct-frontend:prepared
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: scl_ct_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8280/api/v1
      VITE_APP_NAME: Sistema de Certificaciones Laborales Villavicencio
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - ./frontend/react-app:/app
      - ct_frontend_node_modules:/app/node_modules

  test:
    profiles: [test]
    image: scl-ct-app:prepared
    build: *ct_app_build
    container_name: scl_ct_test
    environment:
      <<: *ct_app_environment
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_DATABASE: scl_certificate_types_test
      CACHE_STORE: array
      SESSION_DRIVER: array
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ct_backend_vendor:/var/www/html/vendor
      - ct_test_storage:/var/www/html/storage
    networks:
      - default
      - recovery_database
    command: [php, artisan, test]

  e2e-api:
    profiles: [e2e]
    image: scl-ct-app:prepared
    build: *ct_app_build
    container_name: scl_ct_e2e_api
    environment:
      <<: *ct_app_environment
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://e2e-api:8080
      FRONTEND_URL: http://e2e-web:3000
      DB_DATABASE: scl_certificate_types_e2e
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ct_backend_vendor:/var/www/html/vendor
      - ct_e2e_storage:/var/www/html/storage
    networks:
      - default
      - recovery_database
    command: [php, artisan, serve, "--host=0.0.0.0", "--port=8080", --no-reload]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://localhost:8080/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20

  e2e-web:
    profiles: [e2e]
    image: scl-ct-frontend:prepared
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: scl_ct_e2e_web
    environment:
      VITE_API_BASE_URL: http://e2e-api:8080/api/v1
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: e2e-web
    volumes:
      - ./frontend/react-app:/app
      - ct_e2e_frontend_node_modules:/app/node_modules
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "3000"]

  e2e-runner:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    container_name: scl_ct_e2e_runner
    working_dir: /work
    environment:
      E2E_BASE_URL: http://e2e-web:3000
    volumes:
      - ./frontend/react-app:/work
      - ct_e2e_runner_node_modules:/work/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && npx playwright test"]

networks:
  recovery_database:
    external: true
    name: labor-certification-recovery_default

volumes:
  ct_backend_vendor:
    name: scl_ct_backend_vendor
  ct_backend_build:
    name: scl_ct_backend_build
  ct_backend_storage:
    name: scl_ct_backend_storage
  ct_frontend_node_modules:
    name: scl_ct_frontend_node_modules
  ct_test_storage:
    name: scl_ct_test_storage
  ct_e2e_storage:
    name: scl_ct_e2e_storage
  ct_e2e_frontend_node_modules:
    name: scl_ct_e2e_frontend_node_modules
  ct_e2e_runner_node_modules:
    name: scl_ct_e2e_runner_node_modules
