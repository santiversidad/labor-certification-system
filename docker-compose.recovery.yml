name: labor-certification-recovery

services:
  postgres:
    image: postgres:16-alpine
    container_name: scl_recovery_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scl_recovery_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - recovery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scl_recovery_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    image: scl-recovery-app:baseline
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: scl_recovery_app
    environment: &app_environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8180
      FRONTEND_URL: http://localhost:3100
      APP_TIMEZONE: America/Bogota
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: scl_recovery_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      FILESYSTEM_DISK: local
      SANCTUM_STATEFUL_DOMAINS: localhost:3100,127.0.0.1:3100
    volumes:
      - ./backend/laravel-app:/var/www/html
      - recovery_backend_vendor:/var/www/html/vendor
      - recovery_backend_build:/var/www/html/public/build
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    container_name: scl_recovery_nginx
    ports:
      - "127.0.0.1:8180:80"
    volumes:
      - ./backend/laravel-app:/var/www/html:ro
      - recovery_backend_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: scl-recovery-frontend:baseline
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: scl_recovery_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8180/api/v1
      VITE_APP_NAME: Sistema de Certificaciones Laborales Villavicencio
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./frontend/react-app:/app
      - recovery_frontend_node_modules:/app/node_modules

  e2e-api:
    profiles: [e2e]
    image: scl-recovery-app:baseline
    container_name: scl_recovery_e2e_api
    environment:
      <<: *app_environment
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://e2e-api:8080
      FRONTEND_URL: http://e2e-web:3000
      DB_DATABASE: scl_recovery_e2e
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend/laravel-app:/var/www/html
      - recovery_backend_vendor:/var/www/html/vendor
      - recovery_e2e_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: [php, artisan, serve, "--host=0.0.0.0", "--port=8080", --no-reload]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://localhost:8080/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20

  e2e-web:
    profiles: [e2e]
    image: scl-recovery-frontend:baseline
    container_name: scl_recovery_e2e_web
    environment:
      VITE_API_BASE_URL: http://e2e-api:8080/api/v1
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: e2e-web
    volumes:
      - ./frontend/react-app:/app
      - recovery_frontend_node_modules:/app/node_modules
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "3000"]

  e2e-runner:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /work
    environment:
      E2E_BASE_URL: http://e2e-web:3000
    volumes:
      - ./frontend/react-app:/work
      - recovery_e2e_node_modules:/work/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && npx playwright test"]

volumes:
  recovery_postgres_data:
    name: scl_recovery_postgres_data
  recovery_backend_vendor:
    name: scl_recovery_backend_vendor
  recovery_backend_build:
    name: scl_recovery_backend_build
  recovery_frontend_node_modules:
    name: scl_recovery_frontend_node_modules
  recovery_e2e_storage:
    name: scl_recovery_e2e_storage
  recovery_e2e_node_modules:
    name: scl_recovery_e2e_node_modules
