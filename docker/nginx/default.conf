server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    # Validation/download URLs contain capability tokens. Do not log query/URI values.
    access_log /tmp/performance-nginx.jsonl performance if=$performance_log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log /tmp/performance-nginx.jsonl performance if=$performance_log; log_not_found off; }
    location = /robots.txt  { access_log /tmp/performance-nginx.jsonl performance if=$performance_log; log_not_found off; }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }
    location ~ \.php$ { return 404; }
    location /storage/ { return 404; }

    location ~ /\. {
        deny all;
    }
}

