# Additive, isolated E2E services. Never overrides app/postgres database settings.
services:
  e2e-api:
    image: labor-certification-system-app
    profiles: [e2e]
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://e2e-api:8080
      APP_TIMEZONE: America/Bogota
      FRONTEND_URL: http://e2e-web:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: scl_e2e_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend/laravel-app:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - e2e_storage:/var/www/html/storage
    command: [php, artisan, serve, "--host=0.0.0.0", "--port=8080", --no-reload]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://localhost:8080/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
  e2e-web:
    image: labor-certification-system-frontend
    profiles: [e2e]
    environment:
      VITE_API_BASE_URL: http://e2e-api:8080/api/v1
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: e2e-web
    volumes:
      - ./frontend/react-app:/app
      - frontend_node_modules:/app/node_modules
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "3000"]
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 20
  e2e-runner:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    profiles: [e2e]
    working_dir: /work
    environment:
      E2E_BASE_URL: http://e2e-web:3000
    volumes:
      - ./frontend/react-app:/work
      - e2e_node_modules:/work/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && npx playwright test"]
volumes:
  e2e_storage:
  e2e_node_modules:
